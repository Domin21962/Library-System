<svg viewBox="0 0 420 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shelfWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a3a"/>
      <stop offset="100%" stop-color="#6b4429"/>
    </linearGradient>
  </defs>

  <!-- soft glow behind everything -->
  <ellipse cx="210" cy="210" rx="180" ry="150" fill="#5b8cff" opacity="0.08"/>

  <!-- bookshelf frame -->
  <rect x="40" y="60" width="340" height="260" rx="10" fill="#2a3245" stroke="#3a4459" stroke-width="2"/>

  <!-- shelf boards -->
  <rect x="50" y="140" width="320" height="10" rx="3" fill="url(#shelfWood)"/>
  <rect x="50" y="230" width="320" height="10" rx="3" fill="url(#shelfWood)"/>

  <!-- top row of standing books -->
  <g>
    <rect x="58" y="76" width="18" height="62" fill="#5b8cff"/>
    <rect x="78" y="70" width="16" height="68" fill="#7c6bff"/>
    <rect x="96" y="82" width="14" height="56" fill="#f59e0b"/>
    <rect x="112" y="74" width="17" height="64" fill="#34d399"/>
    <rect x="131" y="78" width="15" height="60" fill="#f87171"/>
    <rect x="148" y="68" width="16" height="70" fill="#5b8cff"/>
    <rect x="166" y="84" width="14" height="54" fill="#facc15"/>
    <!-- leaning book -->
    <rect x="184" y="90" width="16" height="48" fill="#7c6bff" transform="rotate(-12 192 114)"/>
    <rect x="210" y="76" width="15" height="62" fill="#34d399"/>
    <rect x="227" y="72" width="17" height="66" fill="#f59e0b"/>
    <rect x="246" y="80" width="14" height="58" fill="#5b8cff"/>
    <rect x="262" y="70" width="16" height="68" fill="#f87171"/>
    <rect x="280" y="84" width="14" height="54" fill="#7c6bff"/>
    <rect x="296" y="74" width="17" height="64" fill="#facc15"/>
    <rect x="315" y="80" width="15" height="58" fill="#34d399"/>
    <rect x="332" y="72" width="16" height="66" fill="#5b8cff"/>
    <rect x="350" y="82" width="14" height="56" fill="#f59e0b"/>
  </g>

  <!-- middle row: a few books lying flat, stacked -->
  <g>
    <rect x="60" y="205" width="90" height="12" rx="2" fill="#7c6bff"/>
    <rect x="66" y="192" width="78" height="12" rx="2" fill="#5b8cff"/>
    <rect x="72" y="179" width="66" height="12" rx="2" fill="#f59e0b"/>

    <rect x="190" y="150" width="16" height="70" fill="#34d399"/>
    <rect x="208" y="158" width="15" height="62" fill="#f87171"/>
    <rect x="225" y="150" width="17" height="70" fill="#facc15"/>
    <rect x="244" y="160" width="14" height="60" fill="#5b8cff"/>
    <rect x="260" y="152" width="16" height="68" fill="#7c6bff"/>

    <rect x="300" y="195" width="70" height="12" rx="2" fill="#5b8cff"/>
    <rect x="308" y="182" width="58" height="12" rx="2" fill="#34d399"/>
  </g>

  <!-- bottom row: standing books + a small potted plant -->
  <g>
    <rect x="58" y="248" width="16" height="72" fill="#f87171"/>
    <rect x="76" y="240" width="17" height="80" fill="#5b8cff"/>
    <rect x="95" y="252" width="15" height="68" fill="#facc15"/>
    <rect x="112" y="244" width="16" height="76" fill="#7c6bff"/>
    <rect x="130" y="250" width="14" height="70" fill="#34d399"/>

    <!-- potted plant -->
    <path d="M215 300 q8 -30 22 0 z" fill="#34d399"/>
    <path d="M222 296 q10 -26 20 4 z" fill="#22c55e"/>
    <path d="M228 292 q6 -22 14 10 z" fill="#34d399"/>
    <rect x="212" y="300" width="36" height="20" rx="4" fill="#b45309"/>

    <rect x="270" y="246" width="15" height="74" fill="#5b8cff"/>
    <rect x="287" y="252" width="17" height="68" fill="#f59e0b"/>
    <rect x="306" y="240" width="14" height="80" fill="#7c6bff"/>
    <rect x="322" y="250" width="16" height="70" fill="#34d399"/>
    <rect x="340" y="244" width="15" height="76" fill="#f87171"/>

    <!-- open book resting on the shelf edge -->
    <path d="M170 316 q20 -12 40 0 v8 q-20 -8 -40 0 z" fill="#e7ebf3"/>
    <path d="M170 316 q20 -12 40 0" fill="none" stroke="#5b8cff" stroke-width="2"/>
  </g>

  <!-- little desk lamp on top of the shelf -->
  <g>
    <rect x="30" y="55" width="6" height="30" rx="2" fill="#4a5468"/>
    <circle cx="33" cy="52" r="10" fill="#facc15" opacity="0.9"/>
    <ellipse cx="33" cy="52" rx="16" ry="10" fill="#facc15" opacity="0.15"/>
  </g>
</svg>
